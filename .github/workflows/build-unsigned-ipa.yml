name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    # Keep whatever label worked for you (macos-latest, macos-15, macos-15-intel...).
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg
        run: brew install ffmpeg

      # The tvos-assets prebuild plugin encodes App Store listing videos with ffmpeg.
      # They are not part of the app, and the encoding takes a very long time on a CI
      # runner. This wrapper hands real ffmpeg anything that is not a video encode
      # (so encoder detection still works) and writes an empty file for video outputs.
      - name: Install ffmpeg wrapper (skip listing-video encoding)
        run: |
          REAL=$(command -v ffmpeg)
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/ffmpeg" <<WRAP
          #!/bin/bash
          echo "\$(date +%T) ffmpeg \$*" >> "$RUNNER_TEMP/ffmpeg-calls.log"
          last="\${@: -1}"
          case "\$last" in
            *.mp4|*.mov|*.m4v) : > "\$last"; exit 0 ;;
          esac
          exec "$REAL" "\$@"
          WRAP
          chmod +x "$RUNNER_TEMP/fakebin/ffmpeg"
          echo "FFMPEG_PATH=$RUNNER_TEMP/fakebin/ffmpeg" >> "$GITHUB_ENV"

      # Same sequence the project's own archive script uses: prebuild without the
      # install step, then pod install as a separate command.
      - name: Expo prebuild (iOS)
        timeout-minutes: 30
        run: |
          date +%T
          CI=1 EXPO_TV=0 EXPO_MACCATALYST=0 npx expo prebuild --clean -p ios --no-install
          date +%T
          ls ios

      - name: Pod install
        timeout-minutes: 40
        working-directory: ios
        run: |
          date +%T
          pod install
          date +%T
          ls -d *.xcworkspace

      - name: Show ffmpeg calls
        if: always()
        run: cat "$RUNNER_TEMP/ffmpeg-calls.log" 2>/dev/null | cut -c1-300 || true

      - name: Build unsigned .app
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename -s .xcscheme "$(ls ${WORKSPACE%.xcworkspace}.xcodeproj/xcshareddata/xcschemes/*.xcscheme | head -1)")
          [ -n "$WORKSPACE" ] && [ -n "$SCHEME" ] || { echo "no workspace/scheme found"; ls -la; exit 1; }
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          mkdir -p ../build
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build/derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee ../build/xcodebuild.log | (command -v xcbeautify >/dev/null && xcbeautify || cat)
        env:
          NODE_BINARY: node

      - name: Package IPA
        run: |
          APP=$(ls -d build/derived/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../TomoTV-unsigned.ipa Payload)
          ls -lh build/TomoTV-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TomoTV-unsigned-ipa
          path: build/TomoTV-unsigned.ipa
